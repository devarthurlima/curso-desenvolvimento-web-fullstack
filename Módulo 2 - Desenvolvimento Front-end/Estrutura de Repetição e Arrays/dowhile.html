<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do While</title>
  </head>
  <body>
    <script>
      // do while -> Executa o bloco de código pelo menos uma vez antes de testar se a condição é verdadeira.

      let contador = 1;

      do {
        console.log(`Número: ${contador}`);
        contador++;
      } while (contador <= 5);
    </script>
  </body>
</html>
