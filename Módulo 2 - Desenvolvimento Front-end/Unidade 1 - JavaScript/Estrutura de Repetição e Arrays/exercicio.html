<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício Proposto</title>

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;

        display: grid;
        grid-template-columns: 80px 140px 100px;
        gap: 6px 12px;
        align-items: center;
        max-width: fit-content;
      }

      label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #475569;
        grid-row: 1;
      }

      select {
        grid-row: 2;
        width: 100%;
        padding: 8px 28px 8px 12px;
        font-size: 0.95rem;
        color: #1e293b;
        background-color: #ffffff;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        cursor: pointer;
      }

      select:hover {
        border-color: #94a3b8;
      }

      select:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
    </style>
  </head>
  <body>
    <label for="dia">Dia:</label>
    <select id="dia"></select>

    <label for="mes">Mês:</label>
    <select id="mes"></select>

    <label for="ano">Ano:</label>
    <select id="ano"></select>

    <script>
      const diaSelect = document.getElementById("dia");
      const mesSelect = document.getElementById("mes");
      const anoSelect = document.getElementById("ano");

      // 1. Dias: 1 a 31
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = i;
        diaSelect.appendChild(opt);
      }

      // 2. Mêses: Percorrendo o array de nomes
      const meses = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro",
      ];
      for (let i = 0; i < meses.length; i++) {
        const opt = document.createElement("option");
        opt.value = i + 1; // Valor numérico de 1 a 12
        opt.textContent = meses[i];
        mesSelect.appendChild(opt);
      }

      // 3. Anos: Contagem regressiva (2026 até 1976)
      for (let a = 2026; a >= 1976; a--) {
        const opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        anoSelect.appendChild(opt);
      }
    </script>
  </body>
</html>
