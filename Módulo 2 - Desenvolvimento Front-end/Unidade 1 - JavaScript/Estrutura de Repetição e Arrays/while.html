<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While</title>
  </head>
  <body>
    <script>
      // While -> Quando você não sabe previamente quantas vezes o código vai rodar, apenas que ele deve continuar executando enquanto uma condição for verdadeira.
      let codigo = "";
      while (codigo != "sair") {
        codigo = prompt(
          "Digite qualquer letra. Para parar esse programa você deve digitar 'sair'.",
        );
        alert(codigo);
      }
    </script>
  </body>
</html>
