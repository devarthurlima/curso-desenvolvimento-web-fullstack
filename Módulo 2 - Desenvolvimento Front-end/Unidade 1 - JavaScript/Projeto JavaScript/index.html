<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Projeto de JavaScript</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <input
        type="text"
        id="busca"
        onkeyup="pesquisarTarefa()"
        placeholder="Pesquisar por título"
      />
    </header>
    <main>
      <section id="tarefas">
        <h2>Tarefas <button onclick="abrirModal()">nova tarefa</button></h2>
        <!-- <h6>Nenhuma tarefa registrada</h6> -->
        <ul id="lista"></ul>
      </section>
      <section id="overlay" onclick="fecharModal()"></section>
      <div id="criarTarefa" class="modal">
        <form onsubmit="novaTarefa()">
          <h3>
            Criar tarefa
            <svg
              class="icone-fechar"
              onclick="fecharModal()"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="m7.76 14.83-2.83 2.83 1.41 1.41 2.83-2.83 2.12-2.12.71-.71.71.71 1.41 1.42 3.54 3.53 1.41-1.41-3.53-3.54-1.42-1.41-.71-.71 5.66-5.66-1.41-1.41L12 10.59 6.34 4.93 4.93 6.34 10.59 12l-.71.71z"
              ></path>
            </svg>
          </h3>
          <label for="titulo">Título</label>
          <input type="text" name="titulo" id="titulo" required />
          <label for="descricao">Descrição</label>
          <textarea name="descricao" id="descricao" required></textarea>
          <button>Criar</button>
        </form>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
